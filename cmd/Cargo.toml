[package]
name = "mauricebarnum-oxia-cmd"
version = "0.1.0"
publish = false
edition.workspace = true
license = "Apache-2.0"

[features]
default = ["otlp-json-compat"]
otlp-json-compat = []

[[bin]]
name = "oxia-cmd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
futures-util = { version = "0.3.34", default-features = false }
const-hex = { version = "1.19", default-features = false, features = ["std"] }
mauricebarnum-oxia-client = { path = "../client", features = ["metrics"] }
opentelemetry = { version = "0.33.1", default-features = false, features = [
    "metrics",
] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
    "metrics",
] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = [
    "gen-tonic-messages",
    "metrics",
    "with-serde",
] }
prost = { version = "0.14.5", default-features = false, features = ["std"] }
serde_json = "1.0.154"
rustyline = { version = "19.0.0", default-features = false }
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
] }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
    "metrics",
    "testing",
] }
tempfile = "3.27.0"
