[package]
name = "mauricebarnum-oxia-client"
version = "0.1.0"
publish = false
edition.workspace = true
license = "Apache-2.0"

[dependencies]
mauricebarnum-oxia-common = { path = "../common" }
tokio = { version = "1.54.1", features = ["sync", "rt", "time", "macros"] }
tokio-stream = { version = "0.1.19", default-features = false }
tonic = { version = "0.14.9", default-features = false, features = [
    "channel",
] }
thiserror = "2.0.21"
bytes = "1.12.1"
tracing = "0.1.44"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = [
    "alloc",
] }
getrandom = "0.4.3"
rand = "0.10.3"
xxhash-rust = { version = "0.8.19", default-features = false, features = [
    "xxh3",
] }
backon = { version = "1.6.0", default-features = false, features = [
    "std",
    "tokio-sleep",
] }
arc-swap = "1.9"
tokio-util = "0.7.20"
bon = { version = "3.10.3", default-features = false, features = [
    "alloc",
    "implied-bounds",
] }
fastrand = "2.5.0"
prost = { version = "0.14.5", default-features = false, features = ["std"] }
prost-types = "0.14.5"
opentelemetry = { version = "0.33.1", default-features = false, features = [
    "metrics",
], optional = true }

[features]
bench-dashmap = []
go-metrics-compat = ["metrics"]
metrics = ["dep:opentelemetry"]

[dev-dependencies]
dashmap = "6"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
] }
test-log = { version = "0.2.21", default-features = false, features = [
    "color",
    "trace",
] }
oxia-bin-util = { path = "../oxia-bin-util" }
tempfile = "3.27.0"
anyhow = "1.0.104"
rustix = { version = "1.1", default-features = false, features = [
    "process",
    "std",
] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = [
    "metrics",
    "testing",
] }
jiff = { version = "1.0.1", default-features = false, features = ["std"] }

[[bench]]
name = "shard_lookup"
path = "benches/shard_lookup.rs"
harness = false

[[bench]]
name = "channel_pool"
path = "benches/channel_pool.rs"
harness = false

[lints]
workspace = true

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "bytes::bytes::Bytes",
    "tonic::status::Status",
    "tonic::transport::error::Error",
    "futures_core::future::BoxFuture",
    "futures_core::stream::BoxStream",
    "futures_core::stream::Stream",
    "bon::builder_state::IsSet",
    "bon::builder_state::IsUnset",
    "opentelemetry::metrics::meter::MeterProvider",
]
