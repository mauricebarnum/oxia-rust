[package]
name = "mauricebarnum-oxia-common"
version = "0.1.0"
publish = false
edition.workspace = true
license = "Apache-2.0"

[features]
deflate = ["tonic/deflate"]
gzip = ["tonic/gzip"]
zstd = ["tonic/zstd"]

[dependencies]
bytes = "1.12.1"
prost = "0.14.5"
prost-types = "0.14.5"
tonic = { version = "0.14.9", default-features = false, features = [
    "channel",
    "codegen",
] }
tonic-prost = "0.14.9"

[build-dependencies]
prost-build = { version = "0.14", default-features = false }
tonic-prost-build = { version = "0.14.9", default-features = false, features = [
    "transport",
] }

[lints.clippy]
all = "allow"
pedantic = "allow"
