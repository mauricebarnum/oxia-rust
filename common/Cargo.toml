[package]
name = "mauricebarnum-oxia-common"
version = "0.1.0"
publish = false
edition.workspace = true
license = "Apache-2.0"

[dependencies]
bytes = "1.12.1"
prost = "0.14.5"                                                       # If using Protobuf
prost-types = "0.14.5"
tonic = { version = "0.14.9", features = ["gzip", "channel", "zstd"] }
tonic-prost = "0.14.9"

[build-dependencies]
prost-build = "0.14"
tonic-prost-build = "0.14.9"

[lints.clippy]
all = "allow"
pedantic = "allow"
